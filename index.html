<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><meta property="og:title" content="Mateo y el Algoritmo"><meta property="og:description" content="Guía visual para entender tu feed, pensar con criterio y cuidar tu atención."><title>Mateo y el Algoritmo · Lector</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#090b10;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:62px 1fr 58px;background:radial-gradient(circle at 50% 0,#202533 0,#090b10 58%)}button,input{font:inherit}header{display:flex;align-items:center;gap:10px;padding:8px 13px;border-bottom:1px solid #ffffff17;background:#0d1017e9;backdrop-filter:blur(18px);z-index:20}.brand{display:flex;gap:10px;align-items:center;min-width:0}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#ef233c,#ffd60a 52%,#1d70f7);display:grid;place-items:center;font-weight:1000;color:#111}.brand b{display:block;font-size:14px}.brand small{display:block;color:#aeb6c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}.tool{border:1px solid #ffffff1a;background:#151925;color:#fff;border-radius:10px;padding:8px 10px;cursor:pointer}.tool:hover{background:#232a3c}main{position:relative;min-height:0}.stage{height:100%;position:relative;display:flex;align-items:center;justify-content:center;padding:12px 54px;overflow:hidden;touch-action:pan-y;background-image:linear-gradient(#ffffff04 1px,transparent 1px),linear-gradient(90deg,#ffffff04 1px,transparent 1px);background-size:32px 32px}.pagewrap{height:100%;max-height:calc(100dvh - 148px);display:flex;gap:12px;align-items:center;justify-content:center}.sheet{height:100%;max-width:calc(100vw - 120px);object-fit:contain;border-radius:7px;box-shadow:0 24px 70px #000c,0 0 0 1px #fff2;background:#fff;user-select:none;-webkit-user-drag:none}.spread .sheet{max-width:calc((100vw - 145px)/2)}.loading{width:300px;max-width:70vw;aspect-ratio:1000/1414;border-radius:8px;background:linear-gradient(100deg,#171b25 25%,#242b3a 45%,#171b25 65%);background-size:200% 100%;animation:sh 1.1s infinite}@keyframes sh{to{background-position:-200% 0}}.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:72px;border:0;border-radius:13px;background:#111722dd;color:#fff;font-size:30px;cursor:pointer;box-shadow:0 8px 24px #0008;z-index:5}.prev{left:8px}.next{right:8px}footer{display:flex;align-items:center;gap:9px;padding:8px 12px;border-top:1px solid #ffffff17;background:#0d1017e9}.progress{flex:1;height:7px;background:#2a3040;border-radius:99px;overflow:hidden;cursor:pointer}.bar{height:100%;background:linear-gradient(90deg,#ef233c,#ffd60a,#1d70f7);width:0}.counter{min-width:74px;text-align:center;font-size:12px;color:#dbe2ef;font-variant-numeric:tabular-nums}.jump{width:60px;background:#151925;border:1px solid #ffffff1a;color:#fff;border-radius:8px;padding:7px;text-align:center}.drawer{position:absolute;inset:0 auto 0 0;width:min(390px,91vw);background:#0d1017f8;border-right:1px solid #ffffff20;z-index:30;transform:translateX(-102%);transition:.22s;display:grid;grid-template-rows:auto 1fr;box-shadow:20px 0 60px #000b}.drawer.open{transform:none}.drawerhead{padding:15px;display:flex;align-items:center;border-bottom:1px solid #ffffff17}.drawerbody{overflow:auto;padding:10px}.chapter{display:flex;justify-content:space-between;width:100%;padding:12px;border:0;background:transparent;color:#edf3ff;border-radius:9px;cursor:pointer;text-align:left}.chapter:hover{background:#ffffff0c}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.thumb{width:100%;aspect-ratio:1000/1414;object-fit:cover;border-radius:5px;opacity:.75;border:2px solid transparent;cursor:pointer;background:#1b2030}.thumb.active{opacity:1;border-color:#ffd60a}.overlay{position:absolute;inset:0;background:#0008;z-index:25;display:none}.overlay.show{display:block}.zoomed .stage{overflow:auto;align-items:flex-start}.zoomed .sheet{height:auto;max-height:none;max-width:none;width:1040px}@media(max-width:800px){.app{grid-template-rows:54px 1fr 52px}header{padding:6px 8px}.brand small{display:none}.hide-sm{display:none}.stage{padding:8px 35px}.pagewrap{max-height:calc(100dvh - 122px)}.sheet,.spread .sheet{max-width:calc(100vw - 74px);border-radius:4px}.spread .sheet:nth-child(2){display:none}.nav{width:31px;height:56px;font-size:24px}footer{padding:6px 7px;gap:6px}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">M</div><div><b>Mateo y el Algoritmo</b><small>El algoritmo existe. Tu criterio también.</small></div></div><div class="spacer"></div><button class="tool" id="toc">☰ Índice</button><button class="tool hide-sm" id="spreadBtn">▣ Doble</button><button class="tool hide-sm" id="zoomBtn">⌕ Zoom</button><button class="tool" id="fullBtn">⛶</button></header><main><div class="stage" id="stage"><button class="nav prev" id="prev">‹</button><div class="pagewrap" id="pagewrap"><div class="loading"></div></div><button class="nav next" id="next">›</button></div><div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"><div class="drawerhead"><b>Índice del libro</b><div class="spacer"></div><button class="tool" id="closeDrawer">✕</button></div><div class="drawerbody"><div id="chapters"></div><div class="thumbs" id="thumbs"></div></div></aside></main><footer><button class="tool" id="first">⇤</button><button class="tool" id="back">←</button><div class="progress" id="progress"><div class="bar" id="bar"></div></div><span class="counter" id="counter">…</span><input class="jump" id="jump" inputmode="numeric"><button class="tool" id="forward">→</button><button class="tool" id="last">⇥</button></footer></div><script>
const TOTAL=124,CS=4;let p=+(new URLSearchParams(location.search).get('p')||localStorage.getItem('mateo-page')||1);p=Math.max(1,Math.min(TOTAL,p));let spread=localStorage.getItem('mateo-spread')==='1'&&innerWidth>800,zoom=false;const cache=new Map(),meta=new Map();const CHAPTERS=[['Inicio',1],['Dedicatoria',2],['Cómo usarlo',3],['Autor',4],['Índice',5],['Acto I · Nacer',8],['Acto II · Aprender',33],['Acto III · Cerrar el mundo',44],['Acto IV · Dos realidades',54],['Acto V · Recuperar el control',64],['Acto VI · Pensamiento crítico',74],['Acto VII · Entender el sistema',84],['Acto VIII · Practicar la libertad',94],['Acto IX · Compartir lo aprendido',104],['Acto X · Tu criterio en acción',114],['Contraportada',124]];const $=s=>document.querySelector(s),wrap=$('#pagewrap'),bar=$('#bar'),counter=$('#counter'),jump=$('#jump'),drawer=$('#drawer'),overlay=$('#overlay');function chunkFor(i){return Math.ceil(i/CS)}async function loadChunk(c){if(cache.has(c))return cache.get(c);let pr=fetch(`bookdata/chunk-${String(c).padStart(2,'0')}.json`).then(r=>{if(!r.ok)throw Error('No se pudo cargar el libro');return r.json()}).then(a=>{a.forEach(x=>meta.set(x.i,x));return a});cache.set(c,pr);return pr}async function page(i){await loadChunk(chunkFor(i));return meta.get(i)}async function render(push=true){wrap.innerHTML='<div class="loading"></div>';let ids=[p];if(spread&&p<TOTAL)ids.push(p+1);let pages=await Promise.all(ids.map(page));wrap.innerHTML='';wrap.classList.toggle('spread',spread);for(const pg of pages){let im=document.createElement('img');im.className='sheet';im.src=pg.src;im.alt=pg.title;im.draggable=false;im.ondblclick=()=>{zoom=!zoom;document.body.classList.toggle('zoomed',zoom)};wrap.appendChild(im)}counter.textContent=`${p} / ${TOTAL}`;jump.value=p;bar.style.width=((p-1)/(TOTAL-1)*100)+'%';localStorage.setItem('mateo-page',p);if(push)history.replaceState(null,'','?p='+p);document.title=`${pages[0].title} · Mateo y el Algoritmo`;document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('active',i+1===p));[p-2,p-1,p+1,p+2].filter(i=>i>=1&&i<=TOTAL).forEach(i=>loadChunk(chunkFor(i)))}function go(n){p=Math.max(1,Math.min(TOTAL,n));render()}function step(d){go(p+d*(spread?2:1))}$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);$('#back').onclick=()=>step(-1);$('#forward').onclick=()=>step(1);$('#first').onclick=()=>go(1);$('#last').onclick=()=>go(TOTAL);jump.onchange=()=>go(+jump.value||p);$('#spreadBtn').onclick=()=>{spread=!spread;localStorage.setItem('mateo-spread',spread?'1':'0');render(false)};$('#zoomBtn').onclick=()=>{zoom=!zoom;document.body.classList.toggle('zoomed',zoom)};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();function toggle(v){drawer.classList.toggle('open',v);overlay.classList.toggle('show',v)}$('#toc').onclick=async()=>{toggle(true);if(!$('#thumbs').children.length){for(let i=1;i<=TOTAL;i++){let im=document.createElement('img');im.className='thumb';im.loading='lazy';im.dataset.i=i;im.onclick=()=>{go(i);toggle(false)};$('#thumbs').appendChild(im)}for(let c=1;c<=Math.ceil(TOTAL/CS);c++){loadChunk(c).then(a=>a.forEach(pg=>{let el=document.querySelector(`.thumb[data-i="${pg.i}"]`);if(el)el.src=pg.src}))}}};$('#closeDrawer').onclick=()=>toggle(false);overlay.onclick=()=>toggle(false);CHAPTERS.forEach(([name,n])=>{let b=document.createElement('button');b.className='chapter';b.innerHTML=`<span>${name}</span><small>${n}</small>`;b.onclick=()=>{go(n);toggle(false)};$('#chapters').appendChild(b)});$('#progress').onclick=e=>{let r=e.currentTarget.getBoundingClientRect();go(Math.round((e.clientX-r.left)/r.width*(TOTAL-1))+1)};addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();step(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();step(-1)}if(e.key==='Home')go(1);if(e.key==='End')go(TOTAL);if(e.key==='Escape')toggle(false)});let sx=0,sy=0;$('#stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});$('#stage').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)step(dx<0?1:-1)},{passive:true});addEventListener('resize',()=>{if(innerWidth<=800&&spread){spread=false;render(false)}});render(false);
</script></body></html>
