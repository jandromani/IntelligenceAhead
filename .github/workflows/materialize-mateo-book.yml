name: Materialize Mateo book assets

on:
  workflow_dispatch:
  push:
    branches:
      - mateo-book-web
    paths:
      - 'mateo/bundle-trigger.txt'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mateo-book-web
          fetch-depth: 0

      - name: Reconstruct exact book bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mateo/pages
          cat mateo/bundle/part-* > /tmp/mateo-pages.tar
          tar -xf /tmp/mateo-pages.tar -C mateo/pages
          count=$(find mateo/pages -maxdepth 1 -name '*.avif' -type f | wc -l)
          echo "Materialized $count pages"
          test "$count" -eq 124
          test -s mateo/pages/001.avif
          test -s mateo/pages/124.avif

      - name: Commit book pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mateo Book Builder"
          git config user.email "actions@users.noreply.github.com"
          git add mateo/pages
          if git diff --cached --quiet; then
            echo "Pages already materialized"
          else
            git commit -m "Materialize Mateo y el Algoritmo pages"
            git push origin HEAD:mateo-book-web
          fi
