name: Materialize Mateo book assets

on:
  workflow_dispatch:
  push:
    branches:
      - mateo-book-web
    paths:
      - 'mateo/asset-trigger.txt'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mateo-book-web
          fetch-depth: 0
      - name: Download 124 book pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mateo/pages
          count=0
          for list in mateo/asset-part-*.txt; do
            while IFS='|' read -r n url; do
              [ -z "$n" ] && continue
              echo "Downloading page $n"
              curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 120 "$url" -o "mateo/pages/$n.jpg"
              test -s "mateo/pages/$n.jpg"
              count=$((count+1))
            done < "$list"
          done
          echo "Downloaded $count pages"
          test "$count" -eq 124
      - name: Commit exact page assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mateo Book Builder"
          git config user.email "actions@users.noreply.github.com"
          git add mateo/pages
          git commit -m "Materialize Mateo y el Algoritmo pages"
          git push origin HEAD:mateo-book-web
