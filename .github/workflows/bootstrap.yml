name: Bootstrap Intelligence Ahead source

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull current production source and assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://intelligence-ahead-n8870gby9-jandromanis-projects.vercel.app"
          mkdir -p assets/issues/001

          for file in index.html styles.css app.js issue-001.html 404.html robots.txt; do
            curl -fsSL "$BASE/$file" -o "$file"
          done

          for file in \
            01-cover.webp \
            02-modelo-organismo.webp \
            03-agentes-inteligencia.webp \
            04-mosca-pista.webp \
            05-pensar-mejor.webp \
            06-harness.webp \
            07-razonamiento-software.webp \
            08-reality-bridge.webp \
            09-ecologia.webp \
            10-cinco-piezas.webp; do
            curl -fsSL "$BASE/assets/issues/001/$file" -o "assets/issues/001/$file"
          done

      - name: Add source metadata
        shell: bash
        run: |
          cat > vercel.json <<'EOF'
          {
            "cleanUrls": true,
            "trailingSlash": false,
            "headers": [
              {"source":"/(.*)","headers":[{"key":"X-Content-Type-Options","value":"nosniff"},{"key":"Referrer-Policy","value":"strict-origin-when-cross-origin"}]},
              {"source":"/assets/(.*)","headers":[{"key":"Cache-Control","value":"public, max-age=31536000, immutable"}]}
            ]
          }
          EOF

          cat > README.md <<'EOF'
          # The Intelligence Ahead

          **The Intelligence Ahead** is an independent editorial experiment by Alejandro BGN about AI, agents, robotics and the systems that come next.

          ## Current issue

          - Nº001 · September 2026 · **2027: cuando la IA deja de ser un chatbot**

          ## Production

          https://intelligence-ahead.vercel.app/

          This repository is the source of truth for the publication.
          EOF

      - name: Commit bootstrapped source
        shell: bash
        run: |
          git config user.name "Intelligence Ahead Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Bootstrap The Intelligence Ahead from production"
            git push origin HEAD:master
          fi
